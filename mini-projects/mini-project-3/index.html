<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini project 3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
</head>

<body>
    <div class="container">

        <nav class="navbar">
            <div class="logo">
                <span>
                    <img src="assets/logo.png" alt="logo">
                </span>
                ScaleX
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Blogs</a>
                <a href="#">Contact Us</a>
            </div>
            <button class="get-started-btn">Get Started</button>
        </nav>

        <header class="hero">
            <h1>Insights & Blogs</h1>
            <div class="tabs">
                <button class="tab active">All</button>
                <button class="tab">Tech</button>
                <button class="tab">SaaS</button>
                <button class="tab">Marketing</button>
            </div>
        </header>

        <main class="blogs-div">
            <article class="blog-card">
                <div class="image">
                    <img src="assets/img1.png" alt="img1" />
                </div>
                <div class="card-bottom">
                    <span class="category">Tech</span>
                    <h2 class="blog-title">The Ultimate Guide To<br /> SaaS Marketing</h2>
                    <p class="blog-date">May 23, 2025</p>
                </div>
            </article>

            <article class="blog-card">
                <div class="image">
                    <img src="assets/img2.png" alt="img2" />
                </div>
                <div class="card-bottom">
                    <span class="category">SaaS</span>
                    <h2 class="blog-title">5 Key Trends In Saas<br /> Growth For 2025</h2>
                    <p class="blog-date">May 23, 2025</p>
                </div>
            </article>

            <article class="blog-card">
                <div class="image">
                    <img src="assets/img3.png" alt="img3" />
                </div>
                <div class="card-bottom">
                    <span class="category">Marketing</span>
                    <h2 class="blog-title">How Data-Driven<br />Strategies Are Important</h2>
                    <p class="blog-date">May 23, 2025</p>
                </div>
            </article>
        </main>
    </div>
</body>

</html>
